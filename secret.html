<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body { background:linear-gradient(135deg,#f8c8dc,#d9c2f0);
color:#333; font-family:'Press Start 2P', cursive; text-align:center;
padding:60px 20px; font-size:12px; }
#messageBox { min-height:140px; margin-bottom:40px; opacity:1; }
#nextBtn { position:fixed; bottom:20px; right:20px; font-family:'Press Start 2P';
background:#b784c6; color:black; border:3px solid black; padding:12px 16px; font-size:10px; }
.fade-in { animation: fadeIn 2s forwards; }
.fade-out { animation: fadeOut 4s forwards; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
@keyframes fadeOut { from{opacity:1;} to{opacity:0;} }
</style>
</head>
<body>

<div id="messageBox"></div>
<button id="nextBtn" onclick="nextLine()">NEXT ▶</button>

<script>
const lines=[
{ text:"Since the year is ending.. I want to tell you something, my love.", effect:"fade-in" },
{ text:"2025 was a bit hectic but as soon as you entered my life, everything has changed. Never thought someone would become THIS special to me..", effect:"" },
{ text:"Every single moment with you feels like my dream life and definitely finding you was my greatest achievement of 2025.", effect:"" },
{ text:"From the beginning, I've always wanted a person like you, JUST like you, and now look at us, laughing loving and spending all day together. It's like God has already planned our meeting, it's like we're destined to meet, we're destined to be together.", effect:"" },
{ text:"And I wish to spend the rest of my life with you.. my love.", effect:"" },
{ text:"I love you.", effect:"fade-out" }
];
let index=0; let typing=false;
function typeText(element,text,i=0){ if(i<text.length){ element.innerHTML+=text.charAt(i); setTimeout(()=>typeText(element,text,i+1),40); } else{ typing=false; } }
function nextLine(){ if(typing)return; if(index<lines.length){ const box=document.getElementById("messageBox"); box.innerHTML=""; box.className=""; if(lines[index].effect) box.classList.add(lines[index].effect); typing=true; typeText(box,lines[index].text); index++; if(index===lines.length) document.getElementById("nextBtn").style.display="none"; } }
</script>

</body>
</html>
